app-id: io.github.HarbourMasters.Ghostship
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: ghostship.sh
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --device=all        # gamepads
  - --share=network     # controller DB fetch + Satella (mod signing / relay)
  - --filesystem=xdg-documents:ro   # to pick your SM64 ROM
# Placeholders written between at-signs are filled in by prepare.sh (run it before building)
modules:
  - name: libzip
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS=OFF
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DBUILD_TOOLS=OFF
      - -DBUILD_REGRESS=OFF
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_DOC=OFF
      - -DENABLE_BZIP2=OFF
      - -DENABLE_LZMA=OFF
      - -DENABLE_ZSTD=OFF
      - -DENABLE_OPENSSL=OFF
      - -DENABLE_GNUTLS=OFF
      - -DENABLE_MBEDTLS=OFF
    sources:
      - type: archive
        url: '@LIBZIP_URL@'
        sha256: '@LIBZIP_SHA@'

  - name: tinyxml2
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS=OFF
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -Dtinyxml2_BUILD_TESTING=OFF
    sources:
      - type: archive
        url: '@TINYXML2_URL@'
        sha256: '@TINYXML2_SHA@'

  - name: spdlog
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DSPDLOG_BUILD_EXAMPLE=OFF
      - -DSPDLOG_BUILD_TESTS=OFF
    sources:
      - type: archive
        url: '@SPDLOG_URL@'
        sha256: '@SPDLOG_SHA@'

  - name: nlohmann-json
    buildsystem: cmake-ninja
    config-opts:
      - -DJSON_BuildTests=OFF
    sources:
      - type: archive
        url: '@JSON_URL@'
        sha256: '@JSON_SHA@'

  # Ghostship's networking code (ixwebsocket + net/PlayerIdentity.cpp) needs the
  # mbedtls 3.x API; ctr_drbg/entropy were removed in 4.x, so pin 3.6 rather than
  # trusting whatever the SDK ships.
  - name: mbedtls
    buildsystem: cmake-ninja
    config-opts:
      - -DUSE_SHARED_MBEDTLS_LIBRARY=OFF
      - -DUSE_STATIC_MBEDTLS_LIBRARY=ON
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DENABLE_TESTING=OFF
      - -DENABLE_PROGRAMS=OFF
      - -DGEN_FILES=OFF   # release tarball ships the generated files
      - -DMBEDTLS_FATAL_WARNINGS=OFF   # GCC 15 (SDK 25.08) rejects 3.6.3's non-NUL-terminated string initializers under -Werror
    sources:
      - type: archive
        url: '@MBEDTLS_URL@'
        sha256: '@MBEDTLS_SHA@'

  - name: ghostship
    buildsystem: simple
    build-options:
      build-args:
        - --share=network   # CMake FetchContent (imgui, cimgui, dr_libs, ixwebsocket, yaml-cpp, ...) needs network
      env:
        # Game code includes mbedtls/zip headers directly, and Torch is built by a nested
        # ExternalProject that doesn't inherit our -D flags, so make /app visible everywhere.
        CPATH: /app/include
        LIBRARY_PATH: /app/lib
        CMAKE_PREFIX_PATH: /app
        CMAKE_POLICY_VERSION_MINIMUM: '3.5'   # several fetched deps predate CMake 4
    build-commands:
      - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/app -DCMAKE_PREFIX_PATH=/app -DBUILD_SHARED_LIBS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DPython3_EXECUTABLE=/usr/bin/python3
      # If the build fails on Vulkan/shaderc, add -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON to the line above.
      - cmake --build build --target GeneratePortO2R
      - cmake --build build -j"$FLATPAK_BUILDER_N_JOBS"
      - install -Dm755 build/Ghostship /app/ghostship/Ghostship
      - install -Dm644 build/ghostship.o2r /app/ghostship/ghostship.o2r
      # libtcc (TinyCC, used for mod scripting) is built as a shared lib in the build tree and the
      # binary's RUNPATH points there. Upstream only installs it on macOS, so ship every shared lib
      # that resolves into the build tree (libtcc.so, plus anything similar) into /app/lib.
      - ldd build/Ghostship | while read -r name arrow path rest; do case "$path" in /run/build/*) cp -L "$path" "/app/lib/$name";; esac; done
      - test -e /app/lib/libtcc.so
      # TinyCC headers + libtcc1 + crt files, staged by the build next to the binary.
      - test -d build/.tcc/include
      - cp -r build/.tcc /app/ghostship/.tcc
      - install -Dm644 config.yml /app/ghostship/config.yml
      - install -d /app/ghostship/assets && cp -r assets/. /app/ghostship/assets/
      - install -Dm644 gamecontrollerdb.txt /app/ghostship/gamecontrollerdb.txt
      - install -Dm755 ghostship.sh /app/bin/ghostship.sh
      - install -Dm644 io.github.HarbourMasters.Ghostship.desktop /app/share/applications/io.github.HarbourMasters.Ghostship.desktop
      - install -Dm644 logo.png /app/share/icons/hicolor/256x256/apps/io.github.HarbourMasters.Ghostship.png
    sources:
      - type: git
        url: https://github.com/HarbourMasters/Ghostship.git
        commit: '@GHOSTSHIP_COMMIT@'
        disable-submodules: true
      - type: git
        url: https://github.com/HarbourMasters/Torch.git
        commit: '@TORCH_COMMIT@'
        dest: Torch
      - type: archive
        url: '@LUS_URL@'
        sha256: '@LUS_SHA@'
        strip-components: 1
        dest: libultraship
      - type: file
        url: '@GCDB_URL@'
        sha256: '@GCDB_SHA@'
        dest-filename: gamecontrollerdb.txt
      - type: script
        dest-filename: ghostship.sh
        commands:
          - export SHIP_HOME="${XDG_DATA_HOME}/ghostship"
          - mkdir -p "$SHIP_HOME"
          - cd "$SHIP_HOME"
          # ROM extraction (Torch) reads config.yml and assets/ymls from the working directory,
          # and the engine looks for its data next to the working directory / app directory.
          - ln -sfn /app/ghostship/config.yml "$SHIP_HOME/config.yml"
          - ln -sfn /app/ghostship/assets "$SHIP_HOME/assets"
          - ln -sfn /app/ghostship/ghostship.o2r "$SHIP_HOME/ghostship.o2r"
          - ln -sfn /app/ghostship/gamecontrollerdb.txt "$SHIP_HOME/gamecontrollerdb.txt"
          # Mod scripting: .tcc must be writable (the engine drops a libc.so symlink into .tcc/lib),
          # so build a real directory and link the read-only pieces into it.
          - mkdir -p "$SHIP_HOME/.tcc/lib"
          - ln -sfn /app/ghostship/.tcc/include "$SHIP_HOME/.tcc/include"
          - for f in /app/ghostship/.tcc/lib/*; do ln -sf "$f" "$SHIP_HOME/.tcc/lib/"; done
          - exec /app/ghostship/Ghostship "$@"
      - type: file
        path: io.github.HarbourMasters.Ghostship.desktop
