app-id: io.github.HarbourMasters.Ghostship
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: ghostship.sh
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --device=all        # gamepads
  - --share=network     # controller DB fetch, mod relay
  - --filesystem=xdg-documents:ro   # to pick your SM64 ROM
modules:
  - name: ghostship
    buildsystem: simple
    build-commands:
      # The zip ships everything inside an AppImage; extract it (no FUSE needed)
      - chmod +x ghostship.appimage && ./ghostship.appimage --appimage-extract
      - install -d /app/ghostship
      - cp -r squashfs-root/usr /app/ghostship/usr
      # Use the runtime's Vulkan loader so host GPU drivers/ICDs are found
      - rm -f /app/ghostship/usr/lib/libvulkan.so.1
      - install -Dm644 gamecontrollerdb.txt /app/ghostship/usr/bin/gamecontrollerdb.txt
      - install -Dm755 ghostship.sh /app/bin/ghostship.sh
      - install -Dm644 io.github.HarbourMasters.Ghostship.desktop /app/share/applications/io.github.HarbourMasters.Ghostship.desktop
      - install -Dm644 squashfs-root/usr/share/icons/hicolor/256x256/apps/logo.png /app/share/icons/hicolor/256x256/apps/io.github.HarbourMasters.Ghostship.png
    sources:
      - type: archive
        url: https://github.com/HarbourMasters/Ghostship/releases/download/3.0.0/Nautilus-Alfa-Linux.zip
        sha256: f295cb24bfd78660a9caa834e267cc009b4ccdb4ebe68005ab677dc5e4417e83
        strip-components: 0
      - type: script
        dest-filename: ghostship.sh
        commands:
          - export SHIP_HOME="${XDG_DATA_HOME}/ghostship"
          - mkdir -p "$SHIP_HOME"
          - APP=/app/ghostship/usr/bin
          # /app is read-only: link bundled resources into the writable home too
          - for f in ghostship.o2r config.yml assets .tcc include; do ln -sfn "$APP/$f" "$SHIP_HOME/$f"; done
          - '[ -e "$SHIP_HOME/gamecontrollerdb.txt" ] || cp "$APP/gamecontrollerdb.txt" "$SHIP_HOME/"'
          - export LD_LIBRARY_PATH="/app/ghostship/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          - cd "$APP"
          - exec ./Ghostship "$@"
      - type: file
        path: io.github.HarbourMasters.Ghostship.desktop
